[project]
name = "pokemonteambuilder"
version = "0.1.0"
description = "Python-based server for managing Pokemon teams"
authors = [
  { name = "Navan Hassan", email = "navanh89@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
	"aiohttp>=3.11.10",
	"argon2-cffi>=23.1.0",
	"fastapi[standard]",
	"pydantic-settings",
	"python-dotenv>=1.1.0",
	"SQLAlchemy>=2.0.36",
	"aiosqlite"
]

# Entry point for server application
[project.scripts]
teambuilder = "pokemonteambuilder.startup:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]
include = ["pokemonteambuilder*"]

